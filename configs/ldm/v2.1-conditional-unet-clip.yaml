# SD2.1-base backbone, conditional stage (OpenCLIP-H text conditioning).
# Mirrors v1.5-conditional-unet-clip.yaml; deltas: sd21.* targets,
# num_head_channels 64, use_linear_in_transformer, context_dim 1024,
# penultimate-layer text features.
model:
  base_learning_rate: 4.0e-05
  target: sd21.ddpm_clip.LatentDiffusionCond_CLIP
  params:
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: jpg
    cond_stage_key: txt
    image_size: 64
    channels: 4
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: val/loss_simple_ema
    scale_factor: YOUR_SCALE_FACTOR
    use_ema: false
    ckpt_path: YOUR_PATH_TO_UNCOND_CKPT
    clip_version: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
    penultimate: true
    unet_config:
      target: sd21.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_head_channels: 64
        use_spatial_transformer: true
        use_linear_in_transformer: true
        transformer_depth: 1
        context_dim: 1024
        use_checkpoint: false
        legacy: false
        context_length: 0
        n_prompts: 1
    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
          tanh_out: true
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: sd21.encoders.FrozenOpenCLIPHFEmbedder
data:
  target: dataset.Lung_Pair_DM
  params:
    batch_size: 16
    num_workers: 1
    pin_memory: true
    shuffle: true
    ch: 3
    prune: true
    augment: true
    rotate: true
    angles:
    - 45
    - 90
    - 135
    base_path: NLST_with_second_large_cleaned
    model_type: conditional
    construct_prompt: true
trainer:
  max_epochs: 70
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 1
  log_every_n_steps: 5
  track_grad_norm: 2
  deterministic: true
